name: Publish Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK & Checksum
        id: prep
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          APK_NAME="NothingIsland-v${VERSION}.apk"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$APK_NAME"
          fi
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_path=${APK_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NothingIsland-APK
          path: |
            ${{ steps.prep.outputs.apk_path }}
            ${{ steps.prep.outputs.checksum_path }}
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nothing Island ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.prep.outputs.apk_path }}
            ${{ steps.prep.outputs.checksum_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
